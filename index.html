<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>استعلام نتيجة الشهادة الثانوية - Monty Go SDN</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 450px; text-align: center; }
        h2 { margin-bottom: 20px; color: #38bdf8; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 16px; box-sizing: border-box; text-align: center; }
        input:focus { border-color: #38bdf8; outline: none; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        #resultContainer { margin-top: 20px; text-align: right; }
        /* تنسيق لبعض عناصر النتيجة المرجعة من الموقع الأصلي لتبدو مرتبة */
        .result { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-top: 15px; }
        .errorlist { color: #f87171; list-style: none; padding: 0; }
        .notice { color: #fbbf24; }
    </style>
</head>
<body>

<div class="card">
    <h2>استعلام الشهادة الثانوية</h2>
    <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">أدخل رقم الجلوس لجلب البيانات فوراً</p>
    
    <input type="text" id="serialInput" placeholder="أدخل رقم الجلوس" maxlength="6">
    <button onclick="getResult()">استعلام الآن</button>

    <div id="resultContainer"></div>
</div>

<script>
async function getResult() {
    const serial = document.getElementById('serialInput').value.trim();
    const container = document.getElementById('resultContainer');

    if (!serial) {
        alert('الرجاء إدخال رقم الجلوس');
        return;
    }

    container.innerHTML = '<p style="color: #38bdf8;">جاري جلب النتيجة... ⏳</p>';

    try {
        const response = await fetch('/api/result', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.identity ? JSON.stringify({ serial_number: serial }) : JSON.stringify({ serial_number: serial })
        });

        const data = await response.json();

        if (data.success) {
            // تحليل الHTML المرجع واستخراج محتوى صندوق النتيجة أو رسالة الخطأ فقط
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.html, 'text/html');
            
            const targetElement = doc.querySelector('.result') || doc.querySelector('.errorlist') || doc.querySelector('.notice') || doc.querySelector('form');

            if (targetElement) {
                container.innerHTML = targetElement.outerHTML;
            } else {
                container.innerHTML = '<p style="color: #f87171;">لم يتم العثور على بيانات مطابقة لهذا الرقم.</p>';
            }
        } else {
            container.innerHTML = `<p style="color: #f87171;">${data.message}</p>`;
        }

    } catch (error) {
        console.error(error);
        container.innerHTML = '<p style="color: #f87171;">حدث خطأ أثناء الاتصال بالخادم.</p>';
    }
}
</script>

</body>
</html>
