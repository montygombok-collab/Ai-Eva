<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monty Go SDN - الاستعلام عن النتيجة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6;
        }
        .header {
            background-color: #1b365d;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .header h1 {
            font-size: 18px;
        }
        .header span {
            font-size: 14px;
            color: #b0c4de;
        }
        .container {
            width: 100%;
            height: calc(100% - 50px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Monty Go SDN - بوابة النتائج</h1>
        <span>خدمات الاستعلام الإلكتروني</span>
    </div>

    <div class="container">
        <!-- نافذة تضمين الرابط المطلوب -->
        <iframe src="https://result.sd/" title="نظام النتائج"></iframe>
    </div>

</body>
</html>
