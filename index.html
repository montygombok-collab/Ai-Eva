<!-- مكان عرض النتيجة جوه موقعك -->
<div id="resultContainer" style="width: 100%; margin-top: 20px;">
    <iframe id="resultFrame" name="resultFrame" style="width: 100%; height: 500px; border: none; border-radius: 12px; background: transparent;"></iframe>
</div>

<script>
function fetchMyResult() {
    const seatNo = document.getElementById('seatInput').value;
    if (!seatNo) {
        alert('الرجاء إدخال رقم الجلوس');
        return;
    }

    // إنشاء فورم مخفي يوجه الـ POST للـ iframe داخل موقعك بنفسك
    let form = document.getElementById('hiddenResultForm');
    if (!form) {
        form = document.createElement('form');
        form.id = 'hiddenResultForm';
        form.method = 'POST';
        form.action = 'https://result.sd/';
        form.target = 'resultFrame'; // بيعرض النتيجة جوه الـ iframe في موقعك مباشرة!
        
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'seat_number';
        input.id = 'seatInputHidden';
        form.appendChild(input);
        document.body.appendChild(form);
    }

    document.getElementById('seatInputHidden').value = seatNo;
    form.submit();
}
</script>
