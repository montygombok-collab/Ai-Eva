<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monty Go SDN - الاستعلام الذكي للنتائج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #090d16 100%);
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-6">

    <header class="w-full max-w-xl mx-auto flex justify-between items-center py-3 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl shadow-lg shadow-indigo-500/30 text-lg">MG</div>
            <div>
                <h1 class="font-black text-base tracking-wider text-white">Monty Go SDN</h1>
                <p class="text-[10px] text-indigo-300">النظام السيادي الموحد</p>
            </div>
        </div>
        <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-medium">متصل برابط واحد</span>
    </header>

    <main class="w-full max-w-xl mx-auto my-auto py-6">
        <div class="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl border border-indigo-500/20 relative overflow-hidden">
            
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-white mb-2">استعلام النتيجة</h2>
                <p class="text-slate-400 text-sm">أدخل رقم الجلوس لجلب البيانات فوراً برابط موحد</p>
            </div>

            <form id="queryForm" onsubmit="fetchResult(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2 uppercase tracking-wider">رقم الجلوس</label>
                    <input type="text" id="seatNumber" required placeholder="أدخل الرقم هنا..." 
                        class="w-full px-4 py-4 bg-slate-950 border border-slate-700 rounded-2xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-center text-2xl font-mono tracking-widest">
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full py-4 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
                    <span id="btnText">استعلام الآن</span>
                    <div id="btnSpinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                </button>
            </form>

            <div id="resultBox" class="hidden mt-6 p-5 rounded-2xl bg-slate-950/90 border border-indigo-500/30 text-right space-y-3">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-xs text-emerald-400 font-semibold">نتيجة البحث المستخلصة</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                </div>
                <div class="space-y-2 text-sm">
                    <p class="flex justify-between"><span class="text-slate-400">اسم الطالب:</span> <span id="resName" class="font-bold text-white">-</span></p>
                    <p class="flex justify-between"><span class="text-slate-400">رقم الجلوس:</span> <span id="resSeat" class="font-mono text-indigo-300">-</span></p>
                    <p class="flex justify-between"><span class="text-slate-400">النتيجة / النسبة:</span> <span id="resScore" class="font-black text-emerald-400 text-base">-</span></p>
                </div>
            </div>

            <div id="errorBox" class="hidden mt-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-xs text-center">
                <span id="errorText">تعذر العثور على نتيجة لهذا الرقم.</span>
            </div>

        </div>
    </main>

    <footer class="w-full max-w-xl mx-auto text-center py-4 text-xs text-slate-500">
        Monty Go SDN Engine &copy; 2026
    </footer>

    <script>
        async function fetchResult(event) {
            event.preventDefault();
            const seatNo = document.getElementById('seatNumber').value.trim();
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const submitBtn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            const errorBox = document.getElementById('errorBox');
            const errorText = document.getElementById('errorText');

            if (!seatNo) return;

            btnText.textContent = 'جاري المعالجة...';
            btnSpinner.classList.remove('hidden');
            submitBtn.disabled = true;
            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            try {
                // إضافة timestamp لمنع الكاش (Cache) وضمان طلب حي دائم
                const response = await fetch(`/api/result?seat=${encodeURIComponent(seatNo)}&_t=${Date.now()}`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('resName').textContent = data.name;
                    document.getElementById('resSeat').textContent = data.seat;
                    document.getElementById('resScore').textContent = data.score;
                    resultBox.classList.remove('hidden');
                } else {
                    errorText.textContent = data.message || "تعذر العثور على نتيجة لهذا الرقم.";
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorText.textContent = "حدث خطأ في الاتصال بالخادم، يرجى المحاولة لاحقاً.";
                errorBox.classList.remove('hidden');
            } finally {
                btnText.textContent = 'استعلام الآن';
                btnSpinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
