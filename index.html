<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة إفريقيا العالمية - كلية إنديمي للمعادن والنفط</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3 {
            text-align: center;
            color: #2c3e50;
            margin: 5px 0;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box {
            flex: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box:focus {
            border-color: #3498db;
        }
        .search-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 0 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .search-btn:hover {
            background-color: #2980b9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #3498db;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .no-results {
            text-align: center;
            padding: 20px;
            color: #e74c3c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>جامعة إفريقيا العالمية</h2>
    <h3>كلية إنديمي للمعادن والنفط</h3>
    <div class="subtitle">قائمة طلاب الفصل الدراسي الأول - عام (سبتمبر - ديسمبر 2026م)</div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث بالاسم أو الرقم الجامعي (مثال: محمد علوي أو ST2605682)..." oninput="searchStudent()">
        <button class="search-btn" onclick="searchStudent()">بحث</button>
    </div>

    <table id="studentsTable">
        <thead>
            <tr>
                <th>الرقم</th>
                <th>الاسم الكامل</th>
                <th>الرقم الجامعي</th>
                <th>الدولة</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- سيتم تعبئة البيانات برمجياً -->
        </tbody>
    </table>
    <div id="noResults" class="no-results" style="display: none;">عذراً، لم يتم العثور على نتائج تطابق بحثك
