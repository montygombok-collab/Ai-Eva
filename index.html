<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة جبهة - استراتيجية السودان 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; overflow: hidden; background-color: #38bdf8; margin: 0; }
        canvas { display: block; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 0; cursor: grab; }
        canvas:active { cursor: grabbing; }
        .ui-clean { position: relative; z-index: 10; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

    <!-- رندر الثلاثي الأبعاد -->
    <div id="canvas-container"></div>

    <!-- واجهة خفيفة ونظيفة جداً بدون زحمة -->
    <div class="ui-clean flex justify-between items-start w-full max-w-7xl mx-auto">
        <div class="bg-slate-900/80 border border-slate-700/60 px-4 py-3 rounded-2xl backdrop-blur-md shadow-xl text-white">
            <h1 class="text-lg font-black text-red-500">جبهة 🎖️</h1>
            <p class="text-[11px] text-slate-300">اسحب بالماوس للتنقل الحر في العالم</p>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraTarget = { x: 0, z: 0 };

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x38bdf8); // سماوي نهاري ساطع
            scene.fog = new THREE.FogExp2(0x38bdf8, 0.001);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 200, 300);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // إضاءة نهارية صافية وقوية
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
            sunLight.position.set(400, 800, 400);
            sunLight.castShadow = true;
            scene.add(sunLight);

            createTerrain();
            createRiver();
            createCity();

            // تفاعل السحب والانتقال السلس بالماوس (مثل الألعاب الاستراتيجية)
            const canvas = renderer.domElement;
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            canvas.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                // تحريك الكاميرا بسلاسة يميناً ويساراً وفوق وتحت في الخريطة
                camera.position.x -= deltaX * 0.8;
                camera.position.z -= deltaY * 0.8;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function createTerrain() {
            const groundGeo = new THREE.PlaneGeometry(6000, 6000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createRiver() {
            const riverGeo = new THREE.PlaneGeometry(120, 6000);
            const riverMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2 });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.rotation.x = -Math.PI / 2;
            river.position.set(-400, 1, 0);
            scene.add(river);
        }

        function createCity() {
            for (let i = 0; i < 45; i++) {
                const width = 35 + Math.random() * 30;
                const depth = 35 + Math.random() * 30;
                const height = 90 + Math.random() * 180;

                const x = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;

                const buildingGroup = new THREE.Group();

                const bGeo = new THREE.BoxGeometry(width, height, depth);
                const bMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.3 });
                const mesh = new THREE.Mesh(bGeo, bMat);
                mesh.position.y = height / 2;
                mesh.castShadow = true;
                buildingGroup.add(mesh);

                // شبابيك واضحة ومرئية
                const windowGeo = new THREE.BoxGeometry(width * 0.85, 2, depth * 0.85);
                const windowMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
                for (let h = 15; h < height - 10; h += 20) {
                    const win = new THREE.Mesh(windowGeo, windowMat);
                    win.position.y = h;
                    buildingGroup.add(win);
                }

                buildingGroup.position.set(x, 0, z);
                scene.add(buildingGroup);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init3D;
    </script>
</body>
</html>
