<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monty Go SDN - متصفح النتائج السيادي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #090d16 100%);
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-2 md:p-6">

    <!-- الهيدر -->
    <header class="w-full max-w-5xl mx-auto flex justify-between items-center py-3 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white font-black px-3 py-1.5 rounded-xl shadow-lg shadow-indigo-500/30 text-lg">MG</div>
            <div>
                <h1 class="font-black text-base tracking-wider text-white">Monty Go SDN</h1>
                <p class="text-[10px] text-indigo-300">محرك تجاوز الحماية والربط السيادي</p>
            </div>
        </div>
        <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-medium">وضع التجاوز (Bypass Mode)</span>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="w-full max-w-5xl mx-auto my-4 flex-1 flex flex-col">
        <div class="glass-panel rounded-2xl overflow-hidden flex flex-col flex-1 shadow-2xl border border-indigo-500/20">
            
            <!-- شريط العنوان الوهمي -->
            <div class="bg-slate-950 px-4 py-2.5 flex items-center justify-between border-b border-slate-800">
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-lg px-4 py-1 text-xs text-indigo-400 font-mono tracking-wider">
                    https://result.sd/ (Proxied by Monty Go)
                </div>
                <button onclick="reloadEngine()" class="text-xs text-indigo-400 hover:text-white transition-colors bg-indigo-950/50 px-3 py-1 rounded-md border border-indigo-500/30">
                    تحديث المحرك
                </button>
            </div>

            <!-- حاوية عرض الموقع -->
            <div class="relative flex-1 bg-slate-900 flex flex-col min-h-[550px]">
                
                <div id="loadingOverlay" class="absolute inset-0 bg-slate-950 z-20 flex flex-col items-center justify-center gap-4">
                    <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs text-indigo-200 font-medium tracking-wide">جاري حقن وتجاوز بروتوكولات الحماية لـ result.sd...</p>
                </div>

                <!-- استخدام بروكسي متعدد الطبقات لجلب محتوى الموقع بدقة أكبر -->
                <iframe id="targetFrame" 
                    src="https://corsproxy.io/?url=https%3A%2F%2Fresult.sd%2F" 
                    class="w-full flex-1 border-0 bg-white"
                    onload="handleLoadSuccess()"
                    onerror="handleLoadError()">
                ></iframe>
            </div>

        </div>
    </main>

    <!-- الفوتر -->
    <footer class="w-full max-w-5xl mx-auto text-center py-2 text-[11px] text-slate-500">
        Monty Go SDN Core &copy; 2026 - جميع الحقوق محفوظة
    </footer>

    <script>
        function handleLoadSuccess() {
            const loader = document.getElementById('loadingOverlay');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            }
        }

        function handleLoadError() {
            const frame = document.getElementById('targetFrame');
            // محاولة بروكسي بديل في حال فشل الأول
            if (!frame.src.includes('allorigins')) {
                frame.src = 'https://api.allorigins.win/raw?url=https%3A%2F%2Fresult.sd%2F';
            }
        }

        function reloadEngine() {
            const loader = document.getElementById('loadingOverlay');
            const frame = document.getElementById('targetFrame');
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            frame.src = frame.src;
        }
    </script>
</body>
</html>
