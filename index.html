<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة إفريقيا العالمية - كلية إنديمي للمعادن والنفط</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #00f0ff;
            --accent-hover: #00acc1;
            --text-main: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
            border: 1px solid var(--border-color);
        }

        .leader-badge {
            text-align: center;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(138, 43, 226, 0.15));
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        h2, h3 {
            text-align: center;
            color: var(--text-main);
            margin: 8px 0;
        }

        h2 {
            color: var(--accent-color);
            font-size: 24px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-box {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            background-color: #0b0f19;
            border: 2px solid var(--border-color);
            color: white;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .search-btn {
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #0b0f19;
            border: none;
            padding: 0 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .search-btn:hover {
            opacity: 0.95;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 12px;
        }

        th, td {
            padding: 15px 20px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #1f2937;
            color: var(--accent-color);
            font-weight: 600;
            font-size: 15px;
        }

        tr {
            transition: background-color 0.2s;
        }

        tr:hover {
            background-color: rgba(0, 240, 255, 0.05);
        }

        td strong {
            color: var(--accent-color);
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #f87171;
            font-weight: bold;
            background: rgba(248, 113, 113, 0.08);
            border-radius: 12px;
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="leader-badge">إدارة ليدر قاسم</div>
    
    <h2>جامعة إفريقيا العالمية</h2>
    <h3>كلية إنديمي للمعادن والنفط</h3>
    <div class="subtitle">قائمة طلاب الفصل الدراسي الأول - عام (سبتمبر - ديسمبر 2026م)</div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="اكتب جزءاً من الاسم أو الرقم الجامعي (بحث فوري)..." oninput="searchStudent()" onkeydown="if(event.key==='Enter') searchStudent()">
        <button class="search-btn" onclick="searchStudent()">بحث</button>
    </div>

    <table id="studentsTable">
        <thead>
            <tr>
                <th>الرقم</th>
                <th>الاسم الكامل</th>
                <th>الرقم الجامعي</th>
                <th>الدولة</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- سيتم تعبئة البيانات برمجياً -->
        </tbody>
    </table>
    <div id="noResults" class="no-results" style="display: none;">عذراً، لم يتم العثور على نتائج تطابق بحثك. تأكد من صحة الحروف أو الأرقام المدخلة.</div>
</div>

<!-- استدعاء ملف البيانات المنفصل -->
<script src="students_data.js"></script>
<script>
    function displayTable(data) {
        const tbody = document.getElementById('tableBody');
        const noResults = document.getElementById('noResults');
        tbody.innerHTML = '';

        if (data.length === 0) {
            noResults.style.display = 'block';
            return;
        } else {
            noResults.style.display = 'none';
        }

        data.forEach(student => {
            const row = `<tr>
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td><strong>${student.code}</strong></td>
                <td>${student.country}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function searchStudent() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!query) {
            displayTable(students);
            return;
        }
        const filtered = students.filter(student => 
            student.name.toLowerCase().includes(query) || 
            student.code.toLowerCase().includes(query)
        );
        displayTable(filtered);
    }

    // عرض القائمة كاملة عند تحميل الصفحة لأول مرة
    if (typeof students !== 'undefined') {
        displayTable(students);
    } else {
        document.getElementById('noResults').innerText = 'تنبيه: تأكد من وضع ملف students_data.js في نفس المجلد مع ملف index.html';
        document.getElementById('noResults').style.display = 'block';
    }
</script>

</body>
</html>
