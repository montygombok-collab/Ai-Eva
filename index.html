<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ود الحاج AI - تجربة 3D تفاعلية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Reem Kufi', sans-serif;
            background-color: #050302;
            color: #f3e5ab;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* حاوية مشهد الـ 3D */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* واجهة المستخدم الزجاجية الطافية فوق الـ 3D */
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none; /* للسماح بحركة الماوس بالوصول للـ 3D خلفها */
        }

        .interactive-element {
            pointer-events: auto; /* إعادة التفاعل للأزرار والنصوص */
        }

        .glass-panel {
            background: rgba(15, 10, 5, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8),
                        0 0 30px rgba(212, 175, 55, 0.15);
        }

        .gold-glow-text {
            background: linear-gradient(135deg, #fff3a1 0%, #d4af37 50%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(212, 175, 55, 0.4));
        }

        .btn-gold-3d {
            background: linear-gradient(135deg, #d4af37 0%, #996e14 100%);
            color: #0a0602;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4),
                        0 0 0 2px rgba(255, 235, 150, 0.6) inset;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-gold-3d:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.7),
                        0 0 25px rgba(255, 255, 255, 0.9);
            background: linear-gradient(135deg, #ffe066 0%, #d4af37 100%);
        }

        /* الجمل الهيروغليفية في الزوايا */
        .hieroglyph {
            font-size: 1.5rem;
            color: rgba(212, 175, 55, 0.4);
            user-select: none;
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <!-- 1. الكانفاس الخاص بمحرك الـ 3D -->
    <div id="webgl-container"></div>

    <!-- 2. طبقة عناصر الواجهة التفاعلية (UI Layer) -->
    <div class="ui-layer min-h-screen w-full flex flex-col justify-between p-6 md:p-12">

        <!-- الهيدر -->
        <header class="flex justify-between items-center w-full max-w-7xl mx-auto interactive-element">
            <div class="flex items-center gap-3">
                <span class="hieroglyph">𓋹</span>
                <span class="text-xl font-bold tracking-wider gold-glow-text">ود الحاج AI</span>
            </div>
            <div class="text-xs md:text-sm text-amber-200/60 font-mono border border-amber-500/20 px-3 py-1.5 rounded-full glass-panel">
                قسم التاريخ وعلم الآثار
            </div>
        </header>

        <!-- المحتوى المركزي (البطاقة الرئيسية) -->
        <main class="w-full max-w-2xl mx-auto text-center interactive-element my-auto">
            <div class="glass-panel p-8 md:p-12 rounded-3xl relative overflow-hidden">
                <div class="absolute -top-10 -left-10 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>
                
                <p class="text-xs md:text-sm text-amber-400/90 tracking-widest mb-3 font-semibold">
                    𓏤 منصة الذكاء الاصطناعي الأكاديمية 𓏤
                </p>

                <h1 class="text-4xl md:text-6xl font-black gold-glow-text mb-4 leading-tight">
                    ود الحاج AI
                </h1>

                <p class="text-amber-100/70 text-sm md:text-base leading-relaxed mb-8 max-w-lg mx-auto">
                    استكشف واكتشف إجابات المحاضرات والوثائق التاريخية والأثرية في بيئة تفاعلية ثلاثية الأبعاد.
                </p>

                <a href="#search" class="btn-gold-3d inline-flex items-center justify-center gap-3 w-full py-4 px-8 rounded-2xl font-bold text-lg md:text-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <span>ابدأ البحث عن إجابات المحاضرات</span>
                </a>
            </div>
        </main>

        <!-- الفوتر -->
        <footer class="flex justify-between items-center w-full max-w-7xl mx-auto text-xs text-amber-500/50 interactive-element">
            <div class="flex gap-2 items-center">
                <span class="hieroglyph">𓂀</span>
                <span>تفاعل 3D حي (حرك الماوس للمعاينة)</span>
            </div>
            <div>كلية الآداب والتاريخ</div>
        </footer>

    </div>

    <!-- 3. كود Three.js لبناء مشهد 3D تفاعلي للصحراء والأهرامات -->
    <script>
        // إعداد المشهد والكاميرا والمحرك
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0603, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- الإضاءة (Lighting) ---
        const ambientLight = new THREE.AmbientLight(0xffd580, 0.6);
        scene.add(ambientLight);

        // ضوء أصفر ذهبي يمثل شمس الصحراء
        const sunLight = new THREE.DirectionalLight(0xffa500, 2.5);
        sunLight.position.set(5, 10, 5);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // ضوء بؤري ناعم من الأسفل
        const pointLight = new THREE.PointLight(0xff8c00, 1.5, 20);
        pointLight.position.set(0, 0, 3);
        scene.add(pointLight);

        // --- المجسمات (3D Pyramids & Terrain) ---
        const pyramidGroup = new THREE.Group();

        // خامة الذهب المعتق للأهرامات
        const goldMaterial = new THREE.MeshStandardMaterial({
            color: 0xd4af37,
            metalness: 0.8,
            roughness: 0.25,
            flatShading: true
        });

        // دالة لإنشاء أهرامات مروي (زوايا حادة نوبية)
        function createPyramid(radius, height, x, z) {
            const geometry = new THREE.ConeGeometry(radius, height, 4);
            const pyramid = new THREE.Mesh(geometry, goldMaterial);
            pyramid.position.set(x, height / 2 - 1, z);
            pyramid.rotation.y = Math.PI / 4;
            pyramid.castShadow = true;
            pyramid.receiveShadow = true;
            return pyramid;
        }

        // إنشاء هرم مروي الرئيسي في المنتصف
        const mainPyramid = createPyramid(2.2, 4.5, 0, -1);
        pyramidGroup.add(mainPyramid);

        // أهرامات جانبية أصغر
        const sidePyramid1 = createPyramid(1.3, 2.8, -3.2, -2);
        const sidePyramid2 = createPyramid(1.1, 2.3, 3.2, -1.5);
        pyramidGroup.add(sidePyramid1);
        pyramidGroup.add(sidePyramid2);

        scene.add(pyramidGroup);

        // أرضية الصحراء الكثيبية
        const planeGeo = new THREE.PlaneGeometry(60, 60, 32, 32);
        const planeMat = new THREE.MeshStandardMaterial({
            color: 0x2b1808,
            roughness: 0.9,
            metalness: 0.1,
            wireframe: false
        });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -1;
        plane.receiveShadow = true;
        scene.add(plane);

        // --- جزيئات رمل ونجوم عائمة (Dust Particles) ---
        const particlesCount = 400;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 20;
            positions[i + 1] = Math.random() * 10 - 1;
            positions[i + 2] = (Math.random() - 0.5) * 20;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 0.05,
            color: 0xffd700,
            transparent: true,
            opacity: 0.6
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- تفاعل الماوس مع الـ 3D (Mouse Interaction) ---
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - windowHalfX) / 100;
            mouseY = (e.clientY - windowHalfY) / 100;
        });

        // لدعم الشاشات اللمسية (الهواتف)
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = (e.touches[0].clientX - windowHalfX) / 100;
                mouseY = (e.touches[0].clientY - windowHalfY) / 100;
            }
        });

        // --- حلقة التحريك والأنيميشن (Animation Loop) ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // دوران بطيء مستمر للأهرامات
            pyramidGroup.rotation.y = elapsedTime * 0.15;

            // استجابة الكاميرا والمجسمات لحركة الماوس بسلاسة (Interpolation)
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;

            pyramidGroup.rotation.x = targetY * 0.2;
            pyramidGroup.rotation.z = -targetX * 0.1;

            camera.position.x = targetX * 0.5;
            camera.position.y = 2 - (targetY * 0.5);
            camera.lookAt(0, 1, 0);

            // تحريك جزيئات الذهب العائمة
            particles.rotation.y = elapsedTime * 0.03;

            renderer.render(scene, camera);
        }

        animate();

        // إعادة ضبط الحجم عند تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
